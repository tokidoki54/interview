name: "tokidoki_interview_${APP_ENV}"

services:
  php:
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    # Match the host user so the bind-mounted var/ is writable on both sides.
    user: "1000:1000"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ..:/app
    working_dir: /app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ..:/app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
